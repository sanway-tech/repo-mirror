name: Mirror athronix -> sanway-tech (GitHub + Gitee)

on:
  schedule:
    - cron: '0 2 * * *'   # 每日 02:00 UTC = 10:00 北京时间
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare isolated git credentials
        shell: bash
        run: |
          set -euo pipefail
          printf 'https://x-access-token:%s@github.com\n' "${{ secrets.MIRROR_TOKEN }}" > "$RUNNER_TEMP/gh.cred"
          printf 'https://oauth2:%s@gitee.com\n' "${{ secrets.GITEE_MIRROR_TOKEN }}" > "$RUNNER_TEMP/gitee.cred"
          chmod 600 "$RUNNER_TEMP/gh.cred" "$RUNNER_TEMP/gitee.cred"
          cat > "$RUNNER_TEMP/gitconfig" <<EOF
[credential "https://github.com"]
        helper = store --file=$RUNNER_TEMP/gh.cred
[credential "https://gitee.com"]
        helper = store --file=$RUNNER_TEMP/gitee.cred
EOF
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"

      - name: Mirror repositories
        shell: bash
        run: |
          set -euo pipefail
          REPOS="skills workbuddy-virtual-win-plugin winvm-plugin-deploy"
          WORK="$RUNNER_TEMP/mirror"
          mkdir -p "$WORK"
          for repo in $REPOS; do
            echo "===== $repo ====="
            git clone --mirror "https://github.com/athronix/$repo.git" "$WORK/$repo.git"
            echo "--- push GitHub ---"
            git -C "$WORK/$repo.git" push --mirror "https://github.com/sanway-tech/$repo.git"
            echo "--- push Gitee ---"
            git -C "$WORK/$repo.git" push --mirror "https://gitee.com/sanway-tech/$repo.git"
          done

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gh.cred" "$RUNNER_TEMP/gitee.cred" "$RUNNER_TEMP/gitconfig"
