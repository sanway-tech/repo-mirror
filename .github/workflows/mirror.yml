name: Mirror athronix to sanway-tech

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Setup credentials
        run: |
          echo "https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com" > "$RUNNER_TEMP/gh.cred"
          echo "https://oauth2:${{ secrets.GITEE_MIRROR_TOKEN }}@gitee.com" > "$RUNNER_TEMP/gitee.cred"
          chmod 600 "$RUNNER_TEMP/gh.cred" "$RUNNER_TEMP/gitee.cred"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "[credential \"https://github.com\"]" > "$RUNNER_TEMP/gitconfig"
          echo "	helper = store --file=$RUNNER_TEMP/gh.cred" >> "$RUNNER_TEMP/gitconfig"
          echo "[credential \"https://gitee.com\"]" >> "$RUNNER_TEMP/gitconfig"
          echo "	helper = store --file=$RUNNER_TEMP/gitee.cred" >> "$RUNNER_TEMP/gitconfig"

      - name: Mirror repositories
        run: |
          set -e
          for repo in skills workbuddy-virtual-win-plugin winvm-plugin-deploy; do
            echo "===== $repo ====="
            git clone --mirror "https://github.com/athronix/$repo.git" "$RUNNER_TEMP/$repo.git"
            git -C "$RUNNER_TEMP/$repo.git" push --mirror "https://github.com/sanway-tech/$repo.git"
            git -C "$RUNNER_TEMP/$repo.git" push --mirror "https://gitee.com/sanway-tech/$repo.git"
          done

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/gh.cred" "$RUNNER_TEMP/gitee.cred" "$RUNNER_TEMP/gitconfig"
