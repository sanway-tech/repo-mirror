name: Mirror athronix -> sanway-tech (GitHub + Gitee)

on:
  schedule:
    - cron: '0 2 * * *'   # 每日 02:00 UTC = 10:00 北京时间
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare git credentials (GitHub + Gitee isolated)
        shell: bash
        run: |
          printf '[credential "https://github.com"]\n\tusername=x-access-token\n\tpassword=${{ secrets.MIRROR_TOKEN }}\n' > "$RUNNER_TEMP/gh.gitcreds"
          printf '[credential "https://gitee.com"]\n\tusername=oauth2\n\tpassword=${{ secrets.GITEE_MIRROR_TOKEN }}\n' > "$RUNNER_TEMP/gitee.gitcreds"
          chmod 600 "$RUNNER_TEMP/gh.gitcreds" "$RUNNER_TEMP/gitee.gitcreds"

      - name: Mirror repositories
        shell: bash
        run: |
          set -euo pipefail
          REPOS="skills workbuddy-virtual-win-plugin winvm-plugin-deploy"
          WORK="$RUNNER_TEMP/mirror"
          mkdir -p "$WORK"
          for repo in $REPOS; do
            echo "===== $repo ====="
            git clone --mirror "https://github.com/athronix/$repo.git" "$WORK/$repo.git"
            # GitHub target
            git -C "$WORK/$repo.git" -c credential.helper="store --file=$RUNNER_TEMP/gh.gitcreds" push --mirror "https://github.com/sanway-tech/$repo.git"
            # Gitee target
            git -C "$WORK/$repo.git" -c credential.helper="store --file=$RUNNER_TEMP/gitee.gitcreds" push --mirror "https://gitee.com/sanway-tech/$repo.git"
          done

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gh.gitcreds" "$RUNNER_TEMP/gitee.gitcreds"
